services:
  motif-discovery:
    image: dkohlsdorf/motif-discovery:latest
    platform: linux/amd64
    build:
      context: ..
      dockerfile: motif_discovery_job/Dockerfile
    environment:
      # Must match the output_path positional arg in `command:` below --
      # run.sh uses it to know what to upload to Google Drive.
      OUTPUT_PATH: motif/l2
      # Google Drive upload (OAuth only -- see gdrive_upload.py's
      # get_drive_service, same pattern as
      # dolphin_msa/serverless/runpod_worker/handler.py). Values come from
      # whatever's set in the environment `docker compose up` runs in
      # (injected by the cloud platform this gets deployed to) -- never
      # hardcode real credentials here. GDRIVE_OUTPUT_FOLDER_ID left unset
      # makes run.sh skip the upload step entirely.
      GDRIVE_OUTPUT_FOLDER_ID: ${GDRIVE_OUTPUT_FOLDER_ID}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      # ../../audio/train/L2.{csv,wav} on the host (repo root's sibling
      # "audio" dir) -> /audio/train in the container, so the command's
      # "../audio/..." paths resolve the same way they do when run
      # directly from the repo root.
      - ../../audio:/audio:ro
      # ../motif on the host (repo_root/motif) -- motif/l2/candidates.pkl
      # (already computed) is visible as-is, and every new output
      # (phmm_l2.pkl, metrics.csv, submodel_assignments.csv,
      # submodel_*.wav) is written straight back to the host here instead
      # of staying trapped in the container's writable layer.
      - ../motif:/app/motif
      # reuse the already-downloaded openai/whisper-small base weights
      # instead of re-downloading ~1.3GB on first run.
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    command:
      - ../audio/train/L2.csv
      - ../audio/train/L2.wav
      - motif/l2
      - --verbose
      - --max-match
      - "500"
